name: 功能建议
description: 为 Marker 提出新功能或改进建议。
title: "[功能建议] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        感谢分享建议！提交前请先搜索已有 Issues，相同需求可以在原 Issue 中补充使用场景。
        Issues 为公开内容，示例和截图请先脱敏。
  - type: textarea
    id: problem
    attributes:
      label: 使用场景与遇到的问题
      description: 你在什么场景下需要这个功能？目前有哪些不便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的功能或改进
      description: 描述你希望如何使用它，以及期望达到的效果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案（可选）
      description: 是否尝试过其他方式？它们有哪些不足？
  - type: textarea
    id: context
    attributes:
      label: 补充信息（可选）
      description: 可提供示意图、参考链接，或说明建议涉及的平台、阅读模式或编辑模式。
