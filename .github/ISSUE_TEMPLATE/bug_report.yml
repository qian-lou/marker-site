name: 问题反馈
description: 报告 Marker 桌面应用或官网中的异常。
title: "[问题反馈] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢帮助改进 Marker！提交前请先搜索已有 Issues，确认没有相同问题。
        Issues 为公开内容，请勿上传隐私文档、账号凭据或其他敏感信息；示例和截图请先脱敏。
  - type: input
    id: version
    attributes:
      label: Marker 版本
      description: 填写正在使用的应用版本；官网问题请填写“官网”。
      placeholder: 例如：0.1.7
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 使用平台
      options:
        - macOS
        - Windows
        - Linux
        - 官网（浏览器）
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: 填写系统版本与处理器架构；官网问题请补充浏览器及版本。
      placeholder: 例如：macOS 15 / Apple Silicon，或 Windows 11 / x64 / Chrome 版本号
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 描述实际发生的情况，以及对使用造成的影响。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 按顺序描述操作；如果偶发或无法稳定复现，请说明发生时的操作与频率。
      placeholder: |
        1. 打开……
        2. 点击或输入……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望正常情况下发生什么？
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 截图、日志或示例（可选）
      description: 可拖入截图或附件，或粘贴能复现问题的最小 Markdown 示例；请先删除敏感内容。
