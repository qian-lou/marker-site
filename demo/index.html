<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Marker · Live workspace</title>
    <link rel="icon" href="../favicon.png" />
    <style>
      html,body,#root{height:100%;margin:0}
      body{background:#faf9f5}
      @media(max-width:799px){
        #root>div>header{
          height:auto;
          min-height:44px;
          flex-wrap:wrap;
          row-gap:6px;
          padding-block:6px;
        }
        #root>div>header>div:first-child{
          flex:0 0 100%;
          width:100%;
          margin-right:0;
        }
        #root>div>header>div:first-child>div[aria-hidden="true"]{display:none}
        #root>div>header>div:last-child{
          width:100%;
          max-width:100%;
          overflow-x:auto;
          overscroll-behavior-x:contain;
          scrollbar-width:thin;
          padding-bottom:2px;
        }
        #root>div>header>div:last-child>*{flex-shrink:0}
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./entry.tsx"></script>
  </body>
</html>
